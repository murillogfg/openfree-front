<main class="login-page">

  <section class="login-card">

    <div class="brand">

      <span class="brand-mark">

        <img
          src="/brand/genova-mark.png"
          alt="Genova Forge"
          width="52"
          height="52"
        >

      </span>

      <div>

        <h1>
          OpenFree
        </h1>

        <p>
          Conectando empresas e profissionais.
        </p>

      </div>

    </div>


    <form
      [formGroup]="loginForm"
      (ngSubmit)="submit()"
    >

      <!-- E-MAIL -->

      <label for="email">
        E-mail
      </label>

      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="seu@email.com"
      />


      <small
        *ngIf="
          loginForm.controls.email.touched &&
          loginForm.controls.email.invalid
        "
      >
        Informe um e-mail válido.
      </small>


      <!-- SENHA -->

      <label for="senha">
        Senha
      </label>

      <input
        id="senha"
        type="password"
        formControlName="senha"
        placeholder="Sua senha"
      />


      <small
        *ngIf="
          loginForm.controls.senha.touched &&
          loginForm.controls.senha.invalid
        "
      >
        A senha deve possuir ao menos 6 caracteres.
      </small>


      <!-- RECUPERAÇÃO DE SENHA -->

      <div class="forgot-password-link">

        <a routerLink="/forgot-password">
          Esqueci minha senha
        </a>

      </div>


      <!-- ERRO DE LOGIN -->

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>


      <!-- LOGIN -->

      <button
        type="submit"
        [disabled]="loading"
      >
        {{
          loading
            ? 'Entrando...'
            : 'Entrar'
        }}
      </button>

    </form>


    <!-- CADASTRO -->

    <div class="register-link">

      <span>
        Ainda não possui uma conta?
      </span>

      <a routerLink="/register">
        Criar conta
      </a>

    </div>

  </section>

</main>
